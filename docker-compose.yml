services:
  postgres:
    image: postgres:17
    container_name: pkwebapp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pkwebapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "#pk*mg/54PG"

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
